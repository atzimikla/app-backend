# Pipeline raiz para app-backend.
# Spec: build + push a ECR via OIDC (aws-ecr-pusher-backend-oidc).
# Tags publicados:
#   - <short-sha>  (immutable identifier, para trazabilidad)
#   - dev          (mutable, lo que apunta el overlay dev en gitops-apps)

trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

variables:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 875585125966.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_REPO: app-backend

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - template: pipelines/validate.yml

  - stage: BuildAndPush
    displayName: Build and Push
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: pipelines/build-and-push.yml
        parameters:
          awsRegion: $(AWS_REGION)
          ecrRegistry: $(ECR_REGISTRY)
          imageRepo: $(IMAGE_REPO)

  - stage: BumpGitops
    displayName: Bump gitops-apps with new SHA
    dependsOn: BuildAndPush
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: pipelines/bump-gitops.yml
        parameters:
          appName: app-backend
          ecrImageUri: $(ECR_REGISTRY)/$(IMAGE_REPO)
          overlayPath: manifests/app-backend/overlays/dev
