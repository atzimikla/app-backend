# Validacion del PR: secrets scan + Dockerfile lint + SCA + build + smoke test
# + container best-practices + SBOM.
# No requiere credenciales AWS, sirve para PRs sin que ADO pida la SC.

jobs:
  - job: Validate
    displayName: Build image (no push)
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - script: |
          set -euo pipefail
          GITLEAKS_VERSION="v8.21.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks detect --no-git --source . --verbose --redact --exit-code 1
        displayName: Gitleaks secret scan

      - script: |
          set -euo pipefail
          HADOLINT_VERSION="v2.12.0"
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /tmp/hadolint
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/
          hadolint Dockerfile
        displayName: Hadolint Dockerfile lint

      - script: |
          set -euo pipefail
          # Trivy se usa para los 2 scans de SCA (fs + image) — instalamos una
          # sola vez aca.
          TRIVY_VERSION="0.70.0"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/
          trivy --version
        displayName: Install trivy

      - script: |
          set -euo pipefail
          # SCA a nivel source: scanea requirements.txt y otros manifests del
          # repo en busca de deps con CVEs. Bloquea solo en HIGH/CRITICAL con
          # fix upstream disponible.
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            .
        displayName: Trivy fs scan (source SCA)

      - script: |
          set -euo pipefail
          docker build --tag app-backend:ci-validate .
          docker run --rm app-backend:ci-validate python -c "import app; print('import OK')"
        displayName: docker build + smoke test

      - script: |
          set -euo pipefail
          # SCA a nivel container: scan de OS packages + language deps de la
          # imagen recien buildeada. Misma politica que trivy fs.
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            app-backend:ci-validate
        displayName: Trivy image scan (container SCA)

      - script: |
          set -euo pipefail
          # Container best-practices / CIS Docker Benchmark sobre la imagen
          # buildeada. Bloquea solo en FATAL (CVE-style). WARN/INFO se logan
          # como referencia pero no rompen el pipeline.
          DOCKLE_VERSION="0.4.15"
          curl -fsSL "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp dockle
          sudo mv /tmp/dockle /usr/local/bin/
          dockle --exit-code 1 --exit-level FATAL app-backend:ci-validate
        displayName: Dockle (container best practices)

      - script: |
          set -euo pipefail
          # Genera Software Bill of Materials (SBOM) en formato CycloneDX.
          # Es un inventario de paquetes / libs / binarios dentro de la imagen
          # buildeada. No bloquea — se publica como artifact de la pipeline
          # para que cualquier consumo posterior (auditoria, vuln tracking) lo
          # pueda usar.
          SYFT_VERSION="1.44.0"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp syft
          sudo mv /tmp/syft /usr/local/bin/
          syft app-backend:ci-validate -o cyclonedx-json=sbom.json
          echo "=== SBOM summary ==="
          syft app-backend:ci-validate -o table | head -50
        displayName: Syft (generate SBOM)

      - task: PublishPipelineArtifact@1
        inputs:
          path: $(System.DefaultWorkingDirectory)/sbom.json
          artifact: sbom-backend-$(Build.BuildId)
        displayName: Publish SBOM artifact
